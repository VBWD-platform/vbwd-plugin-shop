name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — shop
    runs-on: ubuntu-latest

    steps:
      # ── 1. Clone vbwd-backend ──────────────────────────────────────────────
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      # ── 2. Clone plugin directly into vbwd-backend/plugins/shop ──
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/shop

      # ── 2b. Clone email (shop declares dependencies=["email"]) ─────────────
      # Without it PluginManager refuses to enable shop — "Cannot enable
      # 'shop': dependency 'email' is not enabled" — so the shop blueprint never
      # mounts (core mounts blueprints for enabled plugins only) and every shop
      # route test asserts against 404.
      - name: Clone email dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-email
          path: vbwd-backend/plugins/email

      # ── 2c. Fail fast if the clone-set has drifted from what plugins declare ──
      # Reads PluginMetadata.dependencies over every plugin present (so the
      # transitive closure). A missing peer here would otherwise surface only
      # as dozens of opaque 404s in the test steps. Runtime deps only, no
      # `--for shop`: shop's cms / discount / checkout / marketplace imports are
      # optional (lazy, guarded or importorskip'd tests) and marketplace is
      # private (not clonable here).
      - name: Verify declared plugin dependencies are checked out
        working-directory: vbwd-backend
        run: |
          missing="$(python3 ci/missing_plugin_deps.py)"
          if [ -n "$missing" ]; then
            echo "::error::peer plugins declared but not cloned: $(echo $missing)"
            exit 1
          fi

      # ── 3. Style checks (black · flake8 · mypy) ───────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vbwd-backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vbwd-backend/requirements.txt

      - name: Style check — Black
        run: |
          black --check --diff \
            vbwd-backend/plugins/shop/ \
            --exclude='/(\.git|\.github|__pycache__|\.pytest_cache)/'

      - name: Style check — Flake8
        run: |
          flake8 vbwd-backend/plugins/shop/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=.git,.github,__pycache__,.pytest_cache

      - name: Style check — Mypy
        run: |
          PLUGIN_SRC=vbwd-backend/plugins/shop/src
          if [ -d "$PLUGIN_SRC" ]; then
            mypy "$PLUGIN_SRC" \
              --ignore-missing-imports \
              --no-error-summary \
              --python-version=3.11
          else
            echo "No src/ directory — skipping mypy."
          fi

      # ── 3b. Enable every cloned plugin BEFORE anything boots ──────────────
      # plugins/plugins.json is gitignored, so a fresh checkout has none and the
      # app falls back to plugins.json.dist. Writing the manifest up front
      # (keyed by PluginMetadata.name) means the api and the `test` container
      # both boot with the cloned set enabled, in dependency order.
      - name: Create plugins.json (enable all present plugins)
        working-directory: vbwd-backend
        run: python3 ci/write_plugins_manifest.py

      # ── 4. Start docker compose stack (API + postgres + redis) ────────────
      - name: Start services
        working-directory: vbwd-backend
        run: docker compose up -d --build

      # ── 5. Install and activate plugin ────────────────────────────────────
      - name: Enable all present plugins
        working-directory: vbwd-backend
        # Belt and braces on top of the manifest written above. Enable by
        # PluginMetadata.name, not directory (they can differ, and a directory
        # key is silently ignored by the loader). Two passes: a plugin that
        # sorts before its dependency can only enable on the second pass if the
        # manifest did not already enable it. enable is idempotent. The exclude
        # list still matches on the directory. `exec` reads stdin, so it gets
        # </dev/null or it would swallow the rest of the plugin list.
        run: |
          EXCLUDE_FILE="ci/plugins-enable-exclude.txt"
          for pass in 1 2; do
            while IFS=$'\t' read -r dir name; do
              [ -n "$dir" ] || continue
              if [ -f "$EXCLUDE_FILE" ] && grep -qxF "$dir" "$EXCLUDE_FILE"; then
                echo "Skipping CI-excluded plugin: $dir"; continue
              fi
              docker compose exec -T api flask --app "vbwd:create_app()" plugins enable "$name" </dev/null \
                && echo "Plugin $name enabled (pass $pass)." \
                || echo "Plugin $name already enabled or not registerable — continuing."
            done < <(python3 ci/plugin_names.py)
          done
      - name: Run unit tests
        working-directory: vbwd-backend
        run: |
          mkdir -p test-results
          if [ -d "plugins/shop/tests/unit" ]; then
            TESTS_DIR="plugins/shop/tests/unit/"
          elif [ -d "plugins/shop/tests" ]; then
            TESTS_DIR="plugins/shop/tests/"
            IGNORE="--ignore=plugins/shop/tests/integration/"
          else
            echo "No unit tests — skipping."
            exit 0
          fi
          docker compose --profile test run --rm -T test \
            pytest $TESTS_DIR ${IGNORE:-} \
            -v --tb=short \
            --junit-xml=/app/test-results/unit.xml

      # ── 7. Integration tests ───────────────────────────────────────────────
      - name: Run integration tests
        if: always()
        working-directory: vbwd-backend
        run: |
          if [ -d "plugins/shop/tests/integration" ]; then
            docker compose --profile test run --rm -T test \
              pytest plugins/shop/tests/integration/ \
              -v --tb=short \
              --junit-xml=/app/test-results/integration.xml
          else
            echo "No integration tests — skipping."
          fi

      # ── 8. Upload artifacts ────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shop-${{ github.run_number }}
          path: vbwd-backend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ── 9. Cleanup ─────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        working-directory: vbwd-backend
        run: docker compose down -v
